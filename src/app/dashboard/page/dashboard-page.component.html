@if (page) {
  <div class="header">
    <bq-dashboard-header [menuItems]="page.menuItems" />
  </div>
  <div class="page" [class]="page.layout">
    @for (column of page.columns; track column) {
      <div class="bq-dashboard-column">
        @for (widget of column.widgets; track widget) {
          @switch (widget.type) {
            @case ('blueriq-flow') {
              @if (!refreshWidget) {
                <bq-flow-widget [widget]="widget" [id]="widget.id" />
              }
            }
            @case ('blueriq-task') {
              <bq-task-execution-widget [widget]="widget"
              [id]="widget.id" />
            }
            @case ('blueriq-intake') {
              <bq-intake-widget [widget]="widget"
              [id]="widget.id" />
            }
          }
        }
      </div>
    }
  </div>
  <bq-footer />
}
