<bq-heading [styles]="container.styles" [title]="container.displayName" />

<mat-tab-group [bqContainer]="container">
  @for (child of container.children; track child) {
    <mat-tab>
      <ng-template mat-tab-label>
        {{child.displayName || '[' + child.name + ']'}}
      </ng-template>
      <ng-container [bqElement]="child" />
    </mat-tab>
  }
</mat-tab-group>
