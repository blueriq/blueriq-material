<div bqKey bqClasses [bqContainer]="container">
  <bq-heading [title]="container.displayName" [styles]="container.styles" />
  @if (shouldShowSearchBox() && list.search$ | async; as search) {
    <bq-table-search [search]="search" />
  }
  @if (list.filter$ | async; as filter) {
    <bq-filter [filter]="filter" />
  }
  <bq-table [table]="list.table$ | async" />
  @if (list.pagination$ | async; as pagination) {
    <bq-table-pagination [pagination]="pagination" />
  }
  @if (list.limit$ | async; as limit) {
    <bq-table-limit [limit]="limit" />
  }
</div>
