<div class="header">
  @if (!dashboardHeader) {
    <bq-header [page]="page" />
  }
  @if (dashboardHeader) {
    <ng-container [bqElement]="dashboardHeader" />
  }
  @for (dashboardMenu of dashboardMenus; track dashboardMenu) {
    <ng-container [bqElement]="dashboardMenu" />
  }
</div>

<div class="page fx-flex-row" [class]="pageSize">
  @if (navigationMenu) {
    <div style="flex: 1 1 100%; max-width: 25%">
      <div class="sticky-menu">
        <ng-container [bqElement]="navigationMenu" />
      </div>
    </div>
  }
  <div class="fx-flex">
    @for (child of page.children | bqIncluded; track child) {
      <ng-container [bqElement]="child" />
    }
  </div>
</div>

<bq-footer />
